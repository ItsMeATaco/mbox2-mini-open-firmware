<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="500" rx="16" fill="#0f1115"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#ffffff">Raspberry Pi: wire to pins 3 and 5 only</text>
  <text x="40" y="80" font-size="15" fill="#9aa0aa">Viewed from above, GPIO header along the top edge (Raspberry Pi 4 shown; pins 1 to 6 sit at the same end on every Pi with a 40-pin header)</text>

  <!-- Board -->
  <rect x="40" y="110" width="470" height="290" rx="16" fill="#1d5c3c"/>
  <rect x="68" y="122" width="314" height="40" rx="3" fill="#121418"/>
  <g fill="#d6b45a">
    <!-- 20 columns: outer row (even pins) on top, inner row (odd pins) below; pin 1 is the left end -->
    <circle cx="80" cy="133" r="4.5"/><circle cx="95.5" cy="133" r="4.5"/><circle cx="111" cy="133" r="4.5"/><circle cx="126.5" cy="133" r="4.5"/><circle cx="142" cy="133" r="4.5"/>
    <circle cx="157.5" cy="133" r="4.5"/><circle cx="173" cy="133" r="4.5"/><circle cx="188.5" cy="133" r="4.5"/><circle cx="204" cy="133" r="4.5"/><circle cx="219.5" cy="133" r="4.5"/>
    <circle cx="235" cy="133" r="4.5"/><circle cx="250.5" cy="133" r="4.5"/><circle cx="266" cy="133" r="4.5"/><circle cx="281.5" cy="133" r="4.5"/><circle cx="297" cy="133" r="4.5"/>
    <circle cx="312.5" cy="133" r="4.5"/><circle cx="328" cy="133" r="4.5"/><circle cx="343.5" cy="133" r="4.5"/><circle cx="359" cy="133" r="4.5"/><circle cx="374.5" cy="133" r="4.5"/>
    <rect x="75.5" y="146.5" width="9" height="9"/><circle cx="95.5" cy="151" r="4.5"/><circle cx="111" cy="151" r="4.5"/><circle cx="126.5" cy="151" r="4.5"/><circle cx="142" cy="151" r="4.5"/>
    <circle cx="157.5" cy="151" r="4.5"/><circle cx="173" cy="151" r="4.5"/><circle cx="188.5" cy="151" r="4.5"/><circle cx="204" cy="151" r="4.5"/><circle cx="219.5" cy="151" r="4.5"/>
    <circle cx="235" cy="151" r="4.5"/><circle cx="250.5" cy="151" r="4.5"/><circle cx="266" cy="151" r="4.5"/><circle cx="281.5" cy="151" r="4.5"/><circle cx="297" cy="151" r="4.5"/>
    <circle cx="312.5" cy="151" r="4.5"/><circle cx="328" cy="151" r="4.5"/><circle cx="343.5" cy="151" r="4.5"/><circle cx="359" cy="151" r="4.5"/><circle cx="374.5" cy="151" r="4.5"/>
  </g>
  <circle cx="95.5" cy="151" r="5" fill="#2dd4bf"/><circle cx="111" cy="151" r="5" fill="#2dd4bf"/>
  <rect x="70" y="124" width="50" height="36" rx="4" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="70" y="186" font-size="14" fill="#fbbf24">pin 1: this end, inner row</text>
  <rect x="210" y="210" width="110" height="110" rx="4" fill="#5a5f68"/>
  <rect x="455" y="128" width="70" height="78" rx="3" fill="#b9bdc4"/><text x="490" y="172" font-size="14" text-anchor="middle" fill="#1b1d21">LAN</text>
  <rect x="455" y="218" width="70" height="72" rx="3" fill="#3b82f6"/><text x="490" y="259" font-size="14" text-anchor="middle" fill="#ffffff">USB</text>
  <rect x="455" y="302" width="70" height="72" rx="3" fill="#b9bdc4"/><text x="490" y="343" font-size="14" text-anchor="middle" fill="#1b1d21">USB</text>
  <rect x="90" y="388" width="44" height="22" rx="3" fill="#b9bdc4"/><rect x="170" y="388" width="34" height="22" rx="3" fill="#b9bdc4"/><rect x="220" y="388" width="34" height="22" rx="3" fill="#b9bdc4"/>
  <text x="112" y="432" font-size="13" text-anchor="middle" fill="#9aa0aa">power</text>
  <text x="212" y="432" font-size="13" text-anchor="middle" fill="#9aa0aa">HDMI</text>
  <path d="M 610 445 C 570 445, 560 345, 532 338" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <path d="M 532 338 l 12 -8 l -2 13 z" fill="#fbbf24"/>
  <text x="620" y="440" font-size="15" fill="#fbbf24">The Mbox's USB cable goes into any USB port:</text>
  <text x="620" y="462" font-size="15" fill="#fbbf24">it powers the Mbox and joins the grounds.</text>

  <!-- Zoom on pins 1 to 6 -->
  <path d="M 120 124 L 600 112" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 4" fill="none"/>
  <rect x="600" y="112" width="360" height="276" rx="12" fill="#171a20" stroke="#2a2f38"/>
  <text x="620" y="140" font-size="15" fill="#9aa0aa">Pins 1 to 6, up close</text>
  <g font-size="15" text-anchor="middle">
    <circle cx="680" cy="200" r="24" fill="#d6b45a" stroke="#f87171" stroke-width="5"/><text x="680" y="205" fill="#1b1d21" font-weight="600">2</text>
    <circle cx="780" cy="200" r="24" fill="#d6b45a" stroke="#f87171" stroke-width="5"/><text x="780" y="205" fill="#1b1d21" font-weight="600">4</text>
    <circle cx="880" cy="200" r="24" fill="#d6b45a" stroke="#8a8f98" stroke-width="5"/><text x="880" y="205" fill="#1b1d21" font-weight="600">6</text>
    <text x="680" y="246" fill="#f87171">5 V</text><text x="780" y="246" fill="#f87171">5 V</text><text x="880" y="246" fill="#8a8f98">GND</text>
    <rect x="656" y="276" width="48" height="48" rx="4" fill="#d6b45a" stroke="#f87171" stroke-width="5"/><text x="680" y="305" fill="#1b1d21" font-weight="600">1</text>
    <circle cx="780" cy="300" r="24" fill="#2dd4bf"/><text x="780" y="305" fill="#0f1115" font-weight="700">3</text>
    <circle cx="880" cy="300" r="24" fill="#2dd4bf"/><text x="880" y="305" fill="#0f1115" font-weight="700">5</text>
    <text x="680" y="350" fill="#f87171">3.3 V</text>
    <text x="780" y="350" fill="#2dd4bf" font-weight="600">SDA</text><text x="880" y="350" fill="#2dd4bf" font-weight="600">SCL</text>
    <text x="780" y="370" fill="#ffffff" font-size="13">from U24 SDA</text><text x="880" y="370" fill="#ffffff" font-size="13">from U24 SCL</text>
  </g>
  <text x="620" y="165" font-size="13" fill="#9aa0aa">outer row (board edge)</text>
  <text x="940" y="165" font-size="13" fill="#f87171" text-anchor="end">red: never connect</text>
</svg>
